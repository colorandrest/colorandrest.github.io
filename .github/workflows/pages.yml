name: Publish Color and Rest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare published web artwork
        id: public-assets
        env:
          SOURCE_SITE_URL: https://color-and-rest-magazine.managerbp9.chatgpt.site
        run: |
          if [[ -f public/images/mixing-blue.webp && -f public/fonts/noto-serif-kr.ttf ]]; then
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
          else
            bash scripts/fetch-public-assets.sh
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve web-ready assets
        if: steps.public-assets.outputs.downloaded == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public
          git commit -m "Store web-ready site assets [skip ci]"
          git push origin HEAD:main

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
